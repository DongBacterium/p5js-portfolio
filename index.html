<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dong's Little World</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'VT323', monospace;
background:linear-gradient(
180deg,
#c7a7ff,
#dcbfff
);
min-height:100vh;
padding:40px;
overflow-x:hidden;
}

/* 떠다니는 스티커 */

.sticker{
position:fixed;
font-size:40px;
pointer-events:none;
animation:float 5s ease-in-out infinite;
}

.s1{
top:40px;
left:50px;
}

.s2{
top:100px;
right:80px;
animation-delay:1s;
}

.s3{
bottom:80px;
left:80px;
animation-delay:2s;
}

.s4{
bottom:100px;
right:70px;
animation-delay:3s;
}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-15px);
}

}

.wrapper{
max-width:1100px;
margin:auto;
}

/* 헤더 */

.header{
background:white;
border:4px solid #222;
border-radius:25px;
padding:25px;
margin-bottom:25px;
box-shadow:8px 8px 0px #000;
text-align:center;
}

.header h1{
font-size:72px;
line-height:.9;
}

.header p{
font-size:28px;
margin-top:10px;
}

/* 메모장 */

.note{
background:#fff8c8;
border:4px solid #222;
border-radius:25px;
padding:18px;
margin-bottom:25px;
font-size:28px;
text-align:center;
box-shadow:8px 8px 0px #000;
}

/* 카드 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

.card{
background:white;
border:4px solid #222;
border-radius:25px;
overflow:hidden;
text-decoration:none;
color:black;
box-shadow:8px 8px 0px #000;
transition:.2s;
}

.card:hover{
transform:translate(-5px,-5px);
}

.preview{
position:relative;
aspect-ratio:16/9;
overflow:hidden;
background:#f4f4f4;
border-bottom:4px solid #222;
}

.preview iframe{
position:absolute;
top:0;
left:0;
width:600px;
height:400px;
border:none;
transform-origin:top left;
pointer-events:none;
}

.label{
padding:16px;
font-size:34px;
text-align:center;
background:white;
}

/* 방문자 */

.counter{
margin-top:25px;
background:white;
border:4px solid #222;
border-radius:25px;
padding:15px;
font-size:32px;
text-align:center;
box-shadow:8px 8px 0px #000;
}

/* 모바일 */

@media(max-width:800px){

.grid{
grid-template-columns:1fr;
}

.header h1{
font-size:50px;
}

}

</style>
</head>

<body>

<div class="sticker s1">⭐</div>
<div class="sticker s2">☁️</div>
<div class="sticker s3">🎀</div>
<div class="sticker s4">🐰</div>

<div class="wrapper">

<div class="header">
<h1>★ Dong's Little World ★</h1>
<p>Welcome to my p5.js Portfolio!</p>
</div>

<div class="note">
🌈 Click a project and explore my little world 🌈
</div>

<div class="grid">

<a class="card" href="sample1/index.html">
<div class="preview">
<iframe src="sample1/index.html"></iframe>
</div>
<div class="label">
⭐ 과제 1
</div>
</a>

<a class="card" href="sample4/index.html">
<div class="preview">
<iframe src="sample4/index.html"></iframe>
</div>
<div class="label">
🌙 과제 4
</div>
</a>

<a class="card" href="sample2/index.html">
<div class="preview">
<iframe src="sample2/index.html"></iframe>
</div>
<div class="label">
🍓 과제 2
</div>
</a>

<a class="card" href="sample3/index.html">
<div class="preview">
<iframe src="sample3/index.html"></iframe>
</div>
<div class="label">
🐰 과제 3
</div>
</a>

</div>

<div class="counter">
Visitors : 000124 💜
</div>

</div>

<script>

function scaleFrames(){

document.querySelectorAll('.preview').forEach(preview=>{

const iframe=preview.querySelector('iframe');

const scale=preview.offsetWidth/600;

iframe.style.transform=`scale(${scale})`;

});

}

window.addEventListener('load',scaleFrames);
window.addEventListener('resize',scaleFrames);

</script>

</body>
</html>
