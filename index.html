<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dong's Little World</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'VT323', monospace;
background:
linear-gradient(
180deg,
#12071f 0%,
#2b0d4f 40%,
#4c1d95 100%
);
min-height:100vh;
padding:40px;
overflow-x:hidden;
}

.star{
position:fixed;
color:#ffffff;
font-size:24px;
pointer-events:none;
animation:twinkle 3s infinite;
z-index:0;
}

@keyframes twinkle{

0%,100%{
opacity:.3;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.2);
}

}

.s1{top:5%;left:8%;}
.s2{top:15%;left:80%;}
.s3{top:30%;left:12%;}
.s4{top:22%;left:60%;}
.s5{top:45%;left:90%;}
.s6{top:70%;left:15%;}
.s7{top:80%;left:75%;}
.s8{top:60%;left:45%;}
.s9{top:12%;left:40%;}
.s10{top:85%;left:55%;}


/* 헤더 */

.header{
background:white;
border:4px solid #222;
border-radius:25px;
padding:25px;
margin-bottom:25px;
box-shadow:8px 8px 0px #000;
text-align:center;
}

.header h1{
font-size:72px;
line-height:.9;
}

.header p{
font-size:28px;
margin-top:10px;
}

/* 메모장 */

.note{
background:#f3e8ff;
border:4px solid #222;
border-radius:25px;
padding:18px;
margin-bottom:25px;
font-size:28px;
text-align:center;
box-shadow:8px 8px 0px #000;
}

/* 카드 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

.card{
background:#f8f4ff;
border:4px solid #222;
border-radius:25px;
overflow:hidden;
text-decoration:none;
color:black;
box-shadow:8px 8px 0px #000;
transition:.2s;
}

.card:hover{
transform:translate(-5px,-5px);
}

.preview{
position:relative;
aspect-ratio:16/9;
overflow:hidden;
background:#f4f4f4;
border-bottom:4px solid #222;
}

.preview iframe{
position:absolute;
top:0;
left:0;
width:600px;
height:400px;
border:none;
transform-origin:top left;
pointer-events:none;
}

.label{
padding:16px;
font-size:34px;
text-align:center;
background:white;
}

/* 방문자 */

.counter{
margin-top:25px;
background:white;
border:4px solid #222;
border-radius:25px;
padding:15px;
font-size:32px;
text-align:center;
box-shadow:8px 8px 0px #000;
}

/* 모바일 */

@media(max-width:800px){

.grid{
grid-template-columns:1fr;
}

.header h1{
font-size:50px;
}

}

</style>
</head>

<body>

<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">★</div>
<div class="star s4">✦</div>
<div class="star s5">✧</div>
<div class="star s6">★</div>
<div class="star s7">✦</div>
<div class="star s8">✧</div>
<div class="star s9">★</div>
<div class="star s10">✦</div>

<div class="wrapper">

<div class="header">
<h1>★ Dong's Little World ★</h1>
<p>Welcome to my p5.js Portfolio!</p>
</div>

<div class="note">
🌈 Click a project and explore my little world 🌈
</div>

<div class="grid">

<a class="card" href="sample1/index.html">
<div class="preview">
<iframe src="sample1/index.html"></iframe>
</div>
<div class="label">
⭐ LEVEL 01
</div>
</a>

<a class="card" href="sample4/index.html">
<div class="preview">
<iframe src="sample4/index.html"></iframe>
</div>
<div class="label">
🌙 LEVEL 04
</div>
</a>

<a class="card" href="sample2/index.html">
<div class="preview">
<iframe src="sample2/index.html"></iframe>
</div>
<div class="label">
🌿 LEVEL 02
</div>
</a>

<a class="card" href="sample3/index.html">
<div class="preview">
<iframe src="sample3/index.html"></iframe>
</div>
<div class="label">
✨ LEVEL 03
</div>
</a>

</div>

<div class="counter">
Visitors : 000124 💜
</div>

</div>

<script>

function scaleFrames(){

document.querySelectorAll('.preview').forEach(preview=>{

const iframe=preview.querySelector('iframe');

const scale=preview.offsetWidth/600;

iframe.style.transform=`scale(${scale})`;

});

}

window.addEventListener('load',scaleFrames);
window.addEventListener('resize',scaleFrames);

</script>

</body>
</html>
