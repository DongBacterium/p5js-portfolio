<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dong's Webby Nook</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#a56cff;
  font-family:'VT323', monospace;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
  overflow-x:hidden;
}

.monitor{
  width:1100px;
  max-width:100%;
  background:#d8d8d8;
  border-radius:25px;
  padding:30px;
  box-shadow:
    0 25px 60px rgba(0,0,0,.35),
    inset 0 2px 5px rgba(255,255,255,.8);
}

.screen{
  background:#27d344;
  border:14px solid #9c9c9c;
  border-radius:10px;
  padding:30px;
  position:relative;
  overflow:hidden;
}

.screen::before{
  content:"";
  position:absolute;
  inset:0;
  background:
  repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.05),
    rgba(255,255,255,.05) 2px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
}

.logo{
  text-align:center;
  margin-bottom:20px;
  position:relative;
  z-index:2;
}

.logo h1{
  font-size:72px;
  font-weight:normal;
  line-height:.9;
  color:#000;
}

.logo p{
  font-size:24px;
  margin-top:10px;
}

.message{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
  position:relative;
  z-index:2;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  position:relative;
  z-index:2;
}

.card{
  background:#fff8a7;
  border:4px solid #000;
  text-decoration:none;
  color:#000;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:scale(1.03);
}

.preview{
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:white;
  border-bottom:4px solid #000;
}

.preview iframe{
  position:absolute;
  top:0;
  left:0;
  width:600px;
  height:400px;
  border:none;
  transform-origin:top left;
  pointer-events:none;
}

.label{
  padding:12px;
  text-align:center;
  font-size:32px;
  background:#fff8a7;
}

.counter{
  margin-top:25px;
  text-align:center;
  font-size:28px;
  position:relative;
  z-index:2;
}

.footer{
  margin-top:10px;
  text-align:center;
  font-size:22px;
  position:relative;
  z-index:2;
}

.star{
  position:absolute;
  font-size:24px;
  animation:blink 1.5s infinite;
}

.star:nth-of-type(1){
  top:20px;
  left:20px;
}

.star:nth-of-type(2){
  top:80px;
  right:30px;
}

.star:nth-of-type(3){
  bottom:40px;
  left:40px;
}

@keyframes blink{
  50%{
    opacity:.3;
  }
}

@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

  .logo h1{
    font-size:50px;
  }

}
</style>
</head>

<body>

<div class="monitor">

  <div class="screen">

    <div class="star">★</div>
    <div class="star">★</div>
    <div class="star">★</div>

    <div class="logo">
      <h1>Dong's<br>Webby Nook</h1>
      <p>p5.js Portfolio</p>
    </div>

    <div class="message">
      Click a project to begin!
    </div>

    <div class="grid">

      <!-- 과제 1 -->
      <a class="card" href="sample1/index.html">
        <div class="preview">
          <iframe src="sample1/index.html"></iframe>
        </div>
        <div class="label">
          과제 1
        </div>
      </a>

      <!-- 과제 4 -->
      <a class="card" href="sample4/index.html">
        <div class="preview">
          <iframe src="sample4/index.html"></iframe>
        </div>
        <div class="label">
          과제 4
        </div>
      </a>

      <!-- 과제 2 -->
      <a class="card" href="sample2/index.html">
        <div class="preview">
          <iframe src="sample2/index.html"></iframe>
        </div>
        <div class="label">
          과제 2
        </div>
      </a>

      <!-- 과제 3 -->
      <a class="card" href="sample3/index.html">
        <div class="preview">
          <iframe src="sample3/index.html"></iframe>
        </div>
        <div class="label">
          과제 3
        </div>
      </a>

    </div>

    <div class="counter">
      Visitor Count : 000124
    </div>

    <div class="footer">
      ★ Welcome To My Little Web World ★
    </div>

  </div>

</div>

<script>
function scaleFrames(){

  document.querySelectorAll('.preview').forEach(function(preview){

    const iframe = preview.querySelector('iframe');

    const scale = preview.offsetWidth / 600;

    iframe.style.transform = `scale(${scale})`;

  });

}

window.addEventListener('load', scaleFrames);
window.addEventListener('resize', scaleFrames);
</script>

</body>
</html>
